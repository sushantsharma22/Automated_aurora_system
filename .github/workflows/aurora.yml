name: Aurora-Alert
on:
  schedule:
    - cron: '0 3,7,11,15,19,23 * * *'  # Runs at 10 PM, 2 AM, 6 AM, 10 AM, 2 PM, 6 PM Toronto time
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_APP_PASS: ${{ secrets.MAIL_APP_PASS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        run: |
          missing=0
          for key in MAIL_FROM MAIL_APP_PASS GOOGLE_SHEET_ID GOOGLE_SHEETS_CREDS; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Google Sheets credentials
        env:
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        run: |
          printf '%s' "$GOOGLE_SHEETS_CREDS" > google-creds.json
          python - <<'PY'
          import json

          with open("google-creds.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          required = ["type", "project_id", "client_email", "private_key"]
          missing = [k for k in required if not data.get(k)]
          if missing:
              raise SystemExit(f"Missing key(s) in GOOGLE_SHEETS_CREDS JSON: {', '.join(missing)}")

          print("Google credentials JSON parsed successfully.")
          PY

      - name: Run monitor
        env:
          MAIL_FROM:                ${{ secrets.MAIL_FROM }}
          MAIL_APP_PASS:            ${{ secrets.MAIL_APP_PASS }}
          GOOGLE_SHEET_ID:          ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDS_FILE: google-creds.json
          PYTHONUNBUFFERED:         '1'
        run: python -m aurora.main
